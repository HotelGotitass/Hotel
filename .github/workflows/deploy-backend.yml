name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: hotel-backend
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Autenticación en Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Configurar Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Construir y Subir Imagen Docker (Google Container Registry)
      run: |
        gcloud builds submit --tag gcr.io/$PROJECT_ID/$SERVICE_NAME
        
    - name: Desplegar en Cloud Run
      uses: google-github-actions/deploy-cloudrun@v1
      with:
        service: ${{ env.SERVICE_NAME }}
        image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        flags: '--allow-unauthenticated --port=8080'
