name: CI/CD Pipeline - Hotel Backend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: hotel-backend
  REGION: us-central1

jobs:
  # =======================================================
  # 1. ETAPA DE CI: Compilación y Pruebas
  # =======================================================
  ci:
    name: CI - Compilación y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x ./mvnw

      - name: Ejecutar Pruebas Automatizadas
        run: ./mvnw clean test

  # =======================================================
  # 2. ETAPA DE CD: Construcción y Despliegue en Cloud Run
  # =======================================================
  cd:
    name: CD - Despliegue a Cloud Run
    needs: [ci] # Solo despliega si la etapa de CI pasó exitosamente
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Autenticación en Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # Un secret inexistente llega vacio ("FRONTEND_URL=") y deploy-cloudrun rechaza el despliegue.
      # Aqui se validan los obligatorios, se omiten los opcionales vacios y se genera un archivo
      # de variables (asi los valores con comas, como CORS_ALLOWED_ORIGINS, no se parten).
      - name: Preparar variables de entorno
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_PUBLIC_KEY: ${{ secrets.MP_PUBLIC_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          BILLING_RUC: ${{ secrets.BILLING_RUC }}
          BILLING_NAME: ${{ secrets.BILLING_NAME }}
          BILLING_ADDRESS: ${{ secrets.BILLING_ADDRESS }}
        run: |
          required="DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET JWT_EXPIRATION CORS_ALLOWED_ORIGINS FRONTEND_URL BACKEND_URL MAIL_USERNAME MAIL_PASSWORD"
          optional="MP_ACCESS_TOKEN MP_PUBLIC_KEY CLOUDINARY_URL BILLING_RUC BILLING_NAME BILLING_ADDRESS"

          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets obligatorios en GitHub (Settings > Secrets > Actions):$missing"
            exit 1
          fi

          present="$required"
          for name in $optional; do
            if [ -n "${!name}" ]; then
              present="$present $name"
            else
              echo "::warning::Secret opcional $name no configurado; se despliega sin el"
            fi
          done

          # Los valores se leen del entorno (no van en la linea de comandos); JSON es YAML valido
          python3 -c 'import json, os, sys; print(json.dumps({n: os.environ[n] for n in sys.argv[1:]}))' $present             > "$RUNNER_TEMP/env-vars.yaml"
          echo "Variables preparadas: $present"

      - name: Configurar Docker para Google Container Registry
        run: gcloud auth configure-docker --quiet

      - name: Construir y Subir Imagen Docker
        run: |
          docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:latest .
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

      - name: Desplegar en Cloud Run con Variables de Entorno
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.SERVICE_NAME }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated --port=8080 --env-vars-file=${{ runner.temp }}/env-vars.yaml'

      - name: Borrar archivo de variables
        if: always()
        run: rm -f "$RUNNER_TEMP/env-vars.yaml"
