spring.application.name=hotel-app

# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT Config (24h = 86400000 ms)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Web Booking & Payments
booking.deposit-percentage=50
booking.payment-window-minutes=15

# Mercado Pago (Checkout Pro)
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.public-key=${MP_PUBLIC_KEY:}

# Cloudinary (imagenes del panel). Formato: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
cloudinary.url=${CLOUDINARY_URL:}
mercadopago.currency=PEN
mercadopago.statement-descriptor=HOTEL GOTITAS

# Public URLs (back_urls / notification_url de Mercado Pago)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8080}

# Facturacion electronica SIMULADA (no se conecta a SUNAT ni a ningun OSE/PSE)
billing.issuer.ruc=${BILLING_RUC:20600000005}
billing.issuer.name=${BILLING_NAME:HOTEL GOTITAS S.A.C.}
billing.issuer.address=${BILLING_ADDRESS:Direccion fiscal por configurar}

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
