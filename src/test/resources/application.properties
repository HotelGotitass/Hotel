spring.application.name=hotel-app-test

# Base de datos: PostgreSQL DESECHABLE por Testcontainers (requiere Docker).
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///hotel_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

# JPA Config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway: aplica todas las migraciones sobre la base desechable
spring.flyway.enabled=true

jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZA==
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173

# Web Booking & Payments
booking.deposit-percentage=50
booking.payment-window-minutes=15
mercadopago.access-token=
mercadopago.webhook-secret=test-webhook-secret
mercadopago.currency=PEN
mercadopago.statement-descriptor=HOTEL GOTITAS
app.frontend-url=http://localhost:5173
app.backend-url=http://localhost:8080

# Facturacion electronica SIMULADA
billing.issuer.ruc=20600000005
billing.issuer.name=HOTEL GOTITAS S.A.C.
billing.issuer.address=Direccion de prueba

# Correo: SMTP local inexistente. Nunca se envian correos reales desde los tests;
# los tests que verifican correos usan @MockBean JavaMailSender.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@localhost
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.connectiontimeout=500
spring.mail.properties.mail.smtp.timeout=500
spring.mail.properties.mail.smtp.writetimeout=500
